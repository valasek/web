bio: >
  **I help IT managers and tech leads lead with clarity, confidence and less overwhelm** – whether you are stepping into your first management role, struggling with delegation and feedback, or standing at a career crossroads.
  <br><br>
  I don't coach from theory. I have spent 20 years in IT, 15 of them in management, and I still lead a delivery team at Siemens Healthineers today. I know the pressure of deadlines, stakeholders and people issues from the inside.
  <br><br>
  ICF ACC certified, 170+ hours of coaching and mentoring. Sessions in English, Slovak and Czech – online or in person in Bratislava and Prague.
