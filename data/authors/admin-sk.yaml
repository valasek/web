role: ICF ACC kouč a mentor pre IT manažérov a team leadov
bio: >
  **Pomáham IT manažérom a team leadom viesť s jasnosťou, istotou a bez zbytočného preťaženia** – či práve preberáte svoj prvý tím, bojujete s delegovaním a spätnou väzbou, alebo stojíte na kariérnej križovatke.
  <br><br>
  Nekoučujem z teórie. V IT pracujem 20 rokov, z toho 15 v manažmente, a dodnes vediem delivery tím v Siemens Healthineers. Tlak termínov, stakeholderov a ľudských tém poznám zvnútra.
  <br><br>
  Certifikácia ICF ACC, viac ako 170 hodín koučingu a mentoringu. Stretnutia v slovenčine, češtine a angličtine – online alebo osobne v Bratislave a Prahe.
