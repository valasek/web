# Configuration of Hugo
# Guide: https://docs.hugoblox.com/tutorial/
# Hugo Documentation: https://gohugo.io/getting-started/configuration/#all-configuration-settings
# This file is formatted using YAML syntax - learn more at https://learnxinyminutes.com/docs/yaml/

enableMissingTranslationPlaceholders: true

# Website name (set in params.yaml under hugoblox.branding.name)
title: Stanislav Valášek # Website name
baseURL: 'https://www.stanislavvalasek.com/' # Website URL

############################
## LANGUAGE
############################

defaultContentLanguage: sk
hasCJKLanguage: false
defaultContentLanguageInSubdir: false
removePathAccents: true

############################
## ADVANCED
############################

pluralizelisttitles: false
# Tag titles are derived from front matter; AP title case breaks Slovak ("Vedenie Tímu").
titleCaseStyle: firstupper

# `build` must use `_merge: deep`: the blox module sets build.buildStats plus the
# assets/hugo_stats.json cachebuster, and replacing them breaks Tailwind rebuilds.
build:
  _merge: deep
  # Writing assets/jsconfig.json on each build re-triggers the watcher (endless rebuild loop).
  noJSConfigInAssets: true
enableGitInfo: true
summaryLength: 30
pagination:
  pagerSize: 10
enableEmoji: true
enableRobotsTXT: true
footnotereturnlinkcontents: <sup>^</sup>
ignoreFiles: [".ipynb_checkpoints$", "\\.Rmd$", "\\.Rmarkdown$", "_cache$"]
disableAliases: true
outputs:
  # LLM is the blox module's llms.txt format - keep it when overriding `home`
  home: [HTML, RSS, LLM, headers, redirects]
  section: [HTML, RSS]
imaging:
  resampleFilter: lanczos
  quality: 90
  anchor: smart
  hint: picture
timeout: 600000
# Only tags: blog posts are tagged Personal vs Coaching/Mentoring.
taxonomies:
  tag: tags
markup:
  _merge: deep
  highlight:
    lineNos: false
security:
  _merge: deep
  exec:
    allow: ['^(dart-)?sass$', '^go$', '^git$', '^node$', '^postcss$', '^tailwindcss$']
sitemap:
  _merge: deep
